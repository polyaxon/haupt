<!DOCTYPE html>
<html>

<head>
  {% load static %}
  <title>Polyaxon</title>
  <style>
    .plxLoading {
      position: fixed;
      top: 35%;
      left: 50%;
      width: 64px;
      height: 64px;
      transform: translate(-50%, -50%);
    }
    .plxLoading svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    @media (prefers-reduced-motion: no-preference) {
      .plxLoading path {
        animation: plxLoading 1.2s ease-in-out infinite;
      }
      .plxLoading path:nth-of-type(2) {
        animation-delay: -0.3s;
      }
      .plxLoading path:nth-of-type(3) {
        animation-delay: -0.6s;
      }
      .plxLoading path:nth-of-type(4) {
        animation-delay: -0.9s;
      }
    }
    @keyframes plxLoading {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.35;
      }
    }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="{% static 'images/favicon.ico' %}?version={{ ui_assets_version }}"/>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}?version={{ ui_assets_version }}"/>
  <base href="{{ ui_base_url }}">
</head>
